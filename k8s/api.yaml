apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: elixirman/oilgas-api:latest
          ports: [{ containerPort: 6000 }]
          env:
            - name: DB_HOST
              value: "database"
          envFrom:
            - secretRef: { name: db-secret }
          livenessProbe:
            httpGet: { path: /health, port: 6000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 6000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 6000
      targetPort: 6000
  type: ClusterIP   # private - not exposed outside the cluster
